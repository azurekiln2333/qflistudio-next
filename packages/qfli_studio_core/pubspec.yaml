name: qfli_studio_core
description: "QFLIStudio+ 的共享 IDE 内核：编辑器、文件树、高亮、主题、项目管理与社区客户端。各语言专属 App 都依赖本包。"
publish_to: 'none'
version: 1.0.0+1

# 由仓库根 pubspec.yaml 的 workspace 统一解析，共用一份 pubspec.lock。
resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.5
  file_selector: ^1.0.3
  path: ^1.9.1
  path_provider_ohos: ^2.2.1
  re_editor: ^0.10.0
  archive: ^4.0.7
  http: ^1.6.0
  re_highlight: ^0.0.3
  intl: ^0.20.3
  fast_gbk: ^1.0.0
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 各语言的入门教程，由 TutorialService 读取。
  # 用目录形式声明，新增语言时不必改这里。
  assets:
    - assets/tutorials/
