<script>
(() => {
  const wb = document.getElementById('qfli-workbench-preview');
  const ph = document.getElementById('qfli-phone-preview');
  const saved = window.openai?.widgetState?.privateContent || {};
  let section = ['projects','files','agents'].includes(saved.section) ? saved.section : 'projects';
  let connected = saved.connected !== false;
  let project = saved.project === 'notes_app' ? 'notes_app' : 'hello_flutter';
  let lastMain = 'editor', currentMain = 'editor', phoneTab = 'github', cloned = false;
  const code = wb.querySelector('.wb-code');
  const drafts = {'hello_flutter': code.value, 'notes_app': "void main() {\n  // notes_app\n}\n"};
  const persist = () => { const request = window.openai?.setWidgetState?.({modelContent:{sidebar:section,githubConnected:connected},privateContent:{section,connected,project}}); request?.catch(() => {}); };
  function main(name) {
    currentMain = name;
    if (name === 'editor' || name === 'agent') lastMain = name;
    wb.querySelectorAll('[data-main]').forEach(el => el.hidden = el.dataset.main !== name);
  }
  function showSidebar() {
    wb.querySelectorAll('[data-pane]').forEach(el => el.hidden = el.dataset.pane !== section);
    wb.querySelectorAll('[data-section]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.section === section)));
  }
  function chooseProject(name) {
    drafts[project] = code.value; project = name;
    code.value = drafts[project];
    wb.querySelectorAll('.wb-current').forEach(el => el.textContent = project);
    wb.querySelectorAll('[data-project]').forEach(el => el.classList.toggle('is-active',el.dataset.project === project));
    main('editor'); persist();
  }
  function phonePage(name) {
    ph.querySelectorAll('[data-phone-page]').forEach(el => el.hidden = el.dataset.phonePage !== name);
    ph.querySelector('.ph-heading').textContent = name === 'profile' ? '我的' : name === 'editor' ? '编辑器' : '项目';
    ph.querySelectorAll('[data-phone-nav]').forEach(el => el.setAttribute('aria-pressed',String(el.dataset.phoneNav === name)));
    ph.querySelector('.ph-bottom').hidden = name === 'editor';
  }
  function selectPhoneTab(name) {
    phoneTab = name;
    ph.querySelectorAll('[data-phone-tab]').forEach(el => el.setAttribute('aria-pressed',String(el.dataset.phoneTab === name)));
    ph.querySelector('.ph-repos').hidden = name !== 'github';
    ph.querySelector('.ph-agent-list').hidden = name !== 'agents';
    ph.querySelector('.ph-local-list').hidden = name === 'github' || name === 'agents';
  }
  function connection() {
    wb.querySelector('.wb-github-status').textContent = connected ? '已连接' : '未连接';
    ph.querySelector('.ph-github-status').textContent = connected ? '已连接' : '未连接';
    wb.querySelector('[data-connect-toggle]').textContent = connected ? '断开连接' : '连接 GitHub';
    ph.querySelector('[data-phone-connect]').textContent = connected ? '断开连接' : '连接 GitHub';
    wb.querySelector('.wb-connected-list').hidden = !connected;
    wb.querySelector('.wb-connect-prompt').hidden = connected;
    ph.querySelector('[data-phone-tab="github"]').hidden = !connected;
    if (!connected && phoneTab === 'github') selectPhoneTab('history');
  }
  wb.querySelectorAll('[data-section]').forEach(button => button.addEventListener('click',() => {
    const next = button.dataset.section;
    if (next === section) wb.classList.toggle('is-collapsed'); else wb.classList.remove('is-collapsed');
    section = next; showSidebar();
    if (currentMain === 'profile' || currentMain === 'utility') main(lastMain);
    persist();
  }));
  wb.querySelectorAll('[data-project]').forEach(button => button.addEventListener('click',() => chooseProject(button.dataset.project)));
  wb.querySelectorAll('[data-source]').forEach(button => button.addEventListener('click',() => {
    wb.querySelectorAll('[data-source]').forEach(el => el.setAttribute('aria-pressed',String(el === button)));
    wb.querySelectorAll('[data-list]').forEach(el => el.hidden = el.dataset.list !== button.dataset.source);
  }));
  wb.querySelectorAll('[data-file]').forEach(button => button.addEventListener('click',() => {
    wb.querySelectorAll('.wb-file-name').forEach(el => el.textContent = button.dataset.file);
    main('editor');
    if (matchMedia('(max-width:700px)').matches) wb.classList.add('is-collapsed');
  }));
  wb.querySelectorAll('[data-agent]').forEach(button => button.addEventListener('click',() => {
    wb.querySelector('.wb-agent-title').textContent = button.dataset.agent; main('agent');
    if (matchMedia('(max-width:700px)').matches) wb.classList.add('is-collapsed');
  }));
  wb.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click',() => {
    const page = button.dataset.page;
    if (page === 'profile') main('profile'); else {
      main('utility');
      const labels = {tools:'工具',tutorial:'教程',settings:'设置'};
      wb.querySelector('.wb-utility-title').textContent = labels[page];
      wb.querySelector('.wb-utility-copy').textContent = {tools:'常用开发工具',tutorial:'教程与示例项目',settings:'外观、编辑器与终端'}[page];
    }
    if (matchMedia('(max-width:700px)').matches) wb.classList.add('is-collapsed');
  }));
  wb.querySelectorAll('[data-back-workspace]').forEach(button => button.addEventListener('click',() => main(lastMain)));
  [wb.querySelector('[data-connect-toggle]'),ph.querySelector('[data-phone-connect]')].forEach(button => button.addEventListener('click',() => {connected = !connected; connection();persist();}));
  ph.querySelectorAll('[data-phone-nav]').forEach(button => button.addEventListener('click',() => {
    const target = button.dataset.phoneNav;
    phonePage(target === 'home' || target === 'profile' ? target : 'utility');
    if (target === 'tools' || target === 'tutorial') ph.querySelector('.ph-utility-title').textContent = target === 'tools' ? '工具' : '教程';
  }));
  ph.querySelectorAll('[data-phone-tab]').forEach(button => button.addEventListener('click',() => selectPhoneTab(button.dataset.phoneTab)));
  ph.querySelectorAll('[data-phone-open]').forEach(button => button.addEventListener('click',() => phonePage('editor')));
  ph.querySelector('[data-phone-back]').addEventListener('click',() => phonePage('home'));
  const clone = () => {
    cloned = true;
    wb.querySelector('.wb-clone-label').textContent = '已克隆 · 打开';
    ph.querySelector('.ph-clone-label').textContent = '已克隆 · 打开项目';
  };
  wb.querySelector('[data-clone]').addEventListener('click',() => {if (cloned) main('editor');else clone();});
  ph.querySelector('[data-phone-clone]').addEventListener('click',() => {if (cloned) phonePage('editor');else clone();});
  ph.querySelector('input[type=search]').addEventListener('input',event => {
    const query = event.target.value.toLowerCase();
    ph.querySelectorAll('.ph-repos .ph-project').forEach(el => el.hidden = !el.textContent.toLowerCase().includes(query));
  });
  code.addEventListener('input',() => {drafts[project] = code.value;});
  function restoreState(value) {
    if (!value) return;
    if (['projects','files','agents'].includes(value.section)) section = value.section;
    if (typeof value.connected === 'boolean') connected = value.connected;
    showSidebar();connection();
  }
  window.addEventListener('openai:set_globals',event => restoreState(event.detail?.globals?.widgetState?.privateContent));
  showSidebar();connection();
  wb.querySelectorAll('.wb-current').forEach(el => el.textContent = project);
  code.value = drafts[project];
  if (globalThis.Tweak) {
    const sizing = {sidebarWidth:270};
    const tweak = new Tweak({container:wb,onChange:() => wb.style.setProperty('--wb-side-width',sizing.sidebarWidth + 'px')});
    tweak.addSlider(sizing,'sidebarWidth',{label:'侧栏宽度',min:240,max:340,step:10,unit:'px'});
  }
})();
</script>
