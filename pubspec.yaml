name: qflistudio
description: "A lightweight IDE built with Flutter Material 3."
publish_to: 'none'

version: 5.0.5+5000005

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # IDE 能力由并列仓库的共享内核提供。
  qfli_studio_core:
    path: ../qfli_studio_core

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

# 本地补丁版 re_editor：ohos 上启用 IME 前缀退格与移动选择手柄
# （原包用 kIsAndroid/kIsIOS 判断，flutter_ohos 下均为 false）
dependency_overrides:
  re_editor:
    path: ../qfli_studio_core/vendor/re_editor
  # 远程电脑终端用内核里打过补丁的 xterm 分支。
  # 内核的 dependency_overrides 不会传递给依赖它的 App，所以这里也要覆盖，
  # 否则 App 会解析 pub.dev 上未打补丁的同版本包。
  xterm:
    path: ../qfli_studio_core/vendor/xterm

dev_dependencies:
  flutter_test:
    sdk: flutter

  # tool/new_language_app.dart 用到的路径工具。
  path: ^1.9.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 启动页图标由每个 App 自己声明；内核里的 AssetImage 用同一路径字符串引用。
  # assets/content/ 是由 tool/generate_studio_content.dart 生成的组合内容目录：
  # 主 App 的教程/示例读取所有语言产品各自发布的本地课程，见 provenance.json。
  assets:
    - assets/app_icon.png
    - assets/content/
