name: qflistudio
description: "A lightweight IDE built with Flutter Material 3."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # IDE 能力由并列仓库的共享内核提供。
  qfli_studio_core:
    path: ../qfli_studio_core

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

# 本地补丁版 re_editor：ohos 上启用 IME 前缀退格与移动选择手柄
# （原包用 kIsAndroid/kIsIOS 判断，flutter_ohos 下均为 false）
dependency_overrides:
  re_editor:
    path: ../qfli_studio_core/vendor/re_editor

dev_dependencies:
  flutter_test:
    sdk: flutter

  # tool/new_language_app.dart 用到的路径工具。
  path: ^1.9.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 启动页图标由每个 App 自己声明；内核里的 AssetImage 用同一路径字符串引用。
  assets:
    - assets/app_icon.png
