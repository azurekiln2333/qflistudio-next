name: QFLIStudioN app build setup
description: >-
  Check out the pinned shared core beside the app, install Flutter and resolve
  Dart packages. The app must be checked out at qflistudio inside the workspace,
  and the core at qflistudio-core.

inputs:
  flutter-version:
    description: Flutter version to install.
    required: true
  flutter-commit:
    description: Framework commit the version must resolve to.
    required: true
  flutter-mode:
    description: upstream or ohos. Selects the repository to clone.
    required: false
    default: upstream
  cache-scope:
    description: Build target name. Each target keeps its own Flutter SDK cache.
    required: true
  core-ref:
    description: qflistudio-core commit, tag or branch.
    required: false
    default: 8e031313ffc8d531c5a6b4d131f721f35da04c86
  desktop-platforms:
    description: Comma separated desktop platforms to enable, for example windows,macos.
    required: false
    default: ""
  patch-upstream-core:
    description: Remove OHOS-only Dart APIs from the shared core for upstream Flutter jobs.
    required: false
    default: "true"
  ohos-platform-tooling:
    description: Enable OHOS platform generation. Disable for Dart-only verification without a HarmonyOS SDK.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # plugin_provenance.py and the plugin's Python checks need hashlib.file_digest
    # (Python 3.11 or newer). The Ubuntu 22.04 OHOS and Linux runners ship
    # python3 3.10, so the toolchain is pinned here for every job that uses this
    # composite instead of relying on the system interpreter.
    - name: Set up the pinned Python toolchain
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Check out shared core
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: azurekiln2333/qflistudio-core
        # The app resolves the core through path: ../qflistudio-core.
        ref: ${{ inputs.core-ref }}
        path: qflistudio-core
        persist-credentials: false

    - name: Restore Dart pub cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/pub-cache
        key: pub-${{ inputs.flutter-mode }}-${{ inputs.flutter-version }}-${{ inputs.flutter-commit }}-${{ inputs.core-ref }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qflistudio/pubspec.yaml', 'qflistudio/pubspec.lock', 'qflistudio/pubspec_overrides.yaml', 'qflistudio-core/pubspec.yaml', 'qflistudio-core/pubspec.lock', 'qflistudio-core/pubspec_overrides.yaml', 'qflistudio/companion/windows_assistant/pubspec.lock') }}

    - name: Set pub cache location
      shell: bash
      run: |
        pub_cache="$RUNNER_TEMP/pub-cache"
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          if command -v cygpath >/dev/null 2>&1; then
            temp_posix="$(cygpath -u "$RUNNER_TEMP")"
            pub_cache="$(cygpath -w -a "$temp_posix/pub-cache" | tr -d '\r')"
          else
            pub_cache="$RUNNER_TEMP\\pub-cache"
          fi
        fi
        echo "PUB_CACHE=$pub_cache" >> "$GITHUB_ENV"
        echo "QFLI_PUB_CACHE=$pub_cache" >> "$GITHUB_ENV"

    - name: Verify canonical package paths and imports
      shell: bash
      working-directory: qflistudio
      run: |
        set -euo pipefail
        python_bin=""
        for candidate in python3 python; do
          if command -v "$candidate" >/dev/null 2>&1 &&
            "$candidate" -c 'import sys; sys.exit(0 if sys.version_info[0] == 3 else 1)' >/dev/null 2>&1; then
            python_bin="$candidate"
            break
          fi
        done
        if [ -z "$python_bin" ]; then
          echo "::error::python 3 was not found on this runner."
          exit 1
        fi
        "$python_bin" - <<'PY'
        from pathlib import Path
        import re
        import sys

        app = Path.cwd()
        core = app.parent / "qflistudio-core"
        required = {
            "core": core,
            "re_editor": core / "vendor" / "re_editor",
            "xterm": core / "vendor" / "xterm",
        }
        missing = [f"{name}: {path}" for name, path in required.items() if not path.is_dir()]
        if missing:
            raise SystemExit("Missing canonical sibling path(s): " + ", ".join(missing))

        app_pubspec = (app / "pubspec.yaml").read_text(encoding="utf-8")
        app_lock = (app / "pubspec.lock").read_text(encoding="utf-8")
        core_pubspec = (core / "pubspec.yaml").read_text(encoding="utf-8")
        expected_paths = {
            "qfli_studio_core": "../qflistudio-core",
            "re_editor": "../qflistudio-core/vendor/re_editor",
            "xterm": "../qflistudio-core/vendor/xterm",
        }
        for package, relative in expected_paths.items():
            pattern = rf"(?m)^\s*(?:{re.escape(package)}):\s*\n\s+path:\s*{re.escape(relative)}\s*$"
            if not re.search(pattern, app_pubspec):
                raise SystemExit(f"{package} does not use canonical path {relative}")
            lock_pattern = rf"(?m)^\s*path:\s*[\"']{re.escape(relative)}[\"']\s*$"
            if not re.search(lock_pattern, app_lock):
                raise SystemExit(f"pubspec.lock does not contain canonical path {relative}")

        core_name = re.search(r"(?m)^name:\s*([^\s#]+)\s*$", core_pubspec)
        if not core_name or core_name.group(1) != "qfli_studio_core":
            raise SystemExit("Shared core package name is not qfli_studio_core")

        sources = [*app.joinpath("lib").rglob("*.dart"), *app.joinpath("test").rglob("*.dart")]
        sources += [*core.joinpath("lib").rglob("*.dart"), *core.joinpath("test").rglob("*.dart")]
        wrong = []
        canonical_import_found = False
        for path in sources:
            text = path.read_text(encoding="utf-8")
            # Match quoted Dart directives, not package names in prose comments.
            for match in re.finditer(r"(?m)^[ \t]*(?:import|export)\s+['\"]package:([A-Za-z_][A-Za-z0-9_-]*)/", text):
                package = match.group(1)
                canonical_import_found |= package == "qfli_studio_core"
                if package != "qfli_studio_core" and "studio" in package and "core" in package:
                    wrong.append(f"{path}: package:{package}/")
        if not canonical_import_found:
            raise SystemExit("No canonical package:qfli_studio_core/ import was found")
        if wrong:
            raise SystemExit("Non-canonical shared-core import(s): " + ", ".join(wrong))
        print("PASS canonical app/core package name, imports and three relative paths")
        PY

    - name: Restore Flutter SDK
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/flutter
        key: flutter-${{ inputs.flutter-mode }}-${{ inputs.flutter-version }}-${{ inputs.flutter-commit }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}

    - name: Install Flutter SDK
      shell: bash
      working-directory: qflistudio
      env:
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
        FLUTTER_COMMIT: ${{ inputs.flutter-commit }}
        FLUTTER_MODE: ${{ inputs.flutter-mode }}
      run: |
        arguments=("$RUNNER_TEMP/flutter" "$FLUTTER_VERSION" "$FLUTTER_COMMIT")
        if [ "$FLUTTER_MODE" = "ohos" ]; then
          arguments+=(--ohos)
        fi
        bash tool/ci/setup_flutter.sh "${arguments[@]}"
        echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
        {
          echo "QFLI_FLUTTER_ROOT=$RUNNER_TEMP/flutter"
          echo "QFLI_FLUTTER_VERSION=$FLUTTER_VERSION"
          echo "QFLI_FLUTTER_MODE=$FLUTTER_MODE"
          echo "QFLI_CORE_COMMIT=$(git -C ../qflistudio-core rev-parse HEAD)"
        } >> "$GITHUB_ENV"

    - name: Prepare shared core for the pinned Flutter SDK
      if: inputs.patch-upstream-core == 'true' || inputs.flutter-mode == 'ohos'
      shell: bash
      working-directory: qflistudio
      env:
        FLUTTER_MODE: ${{ inputs.flutter-mode }}
        SDK_ROOT: ${{ runner.temp }}/flutter
        SDK_REVISION: ${{ inputs.flutter-commit }}
      run: |
        set -euo pipefail
        case "$FLUTTER_MODE" in
          upstream) flavor=official ;;
          ohos) flavor=ohos ;;
          *) echo "::error::Unsupported Flutter mode: $FLUTTER_MODE"; exit 1 ;;
        esac
        python3 -B ../qflistudio-core/tool/ci/prepare_flutter_core.py \
          --flavor "$flavor" --sdk-root "$SDK_ROOT" \
          --sdk-revision "$SDK_REVISION" --app-root .

    - name: Resolve Dart packages
      shell: bash
      working-directory: qflistudio
      env:
        FLUTTER_MODE: ${{ inputs.flutter-mode }}
        DESKTOP_PLATFORMS: ${{ inputs.desktop-platforms }}
        OHOS_PLATFORM_TOOLING: ${{ inputs.ohos-platform-tooling }}
      run: |
        flutter --version
        flutter config --no-analytics
        if [ "$FLUTTER_MODE" = "ohos" ]; then
          if [ "$OHOS_PLATFORM_TOOLING" = "true" ]; then
            flutter config --enable-ohos
          else
            flutter config --no-enable-ohos
          fi
        fi
        # The cache key separates upstream and OHOS SDKs. Upstream Flutter has
        # no enable-ohos config flag, so do not pass an OHOS-only option here.
        for platform in ${DESKTOP_PLATFORMS//,/ }; do
          flutter config --enable-"${platform}"-desktop
        done
        # Flutter rewrites pubspec.lock for its own SDK. The runner copy is not
        # committed back, but a large diff means the resolved versions changed.
        bash tool/ci/run_logged.sh "flutter pub get" flutter pub get
        if ! git diff --quiet -- pubspec.lock; then
          echo "::warning::flutter pub get changed pubspec.lock on the runner"
          git --no-pager diff --stat -- pubspec.lock
        fi

    # The app reaches qfli_git through the shared core. Record the resolved
    # commit and native lock in every build job. Package jobs and publication
    # require complete facts; this step stays tolerant so a temporary pin still
    # produces an analysable build instead of hiding the real compile error.
    - name: Record the pinned qfli_git revision
      shell: bash
      working-directory: qflistudio
      run: |
        python_bin="$(command -v python3)"
        if [ -z "$python_bin" ]; then
          echo "::error::python 3 was not found on this runner."
          exit 1
        fi
        "$python_bin" -c 'import sys; print("python " + sys.version.split()[0])'
        if ! "$python_bin" -c 'import hashlib; hashlib.file_digest'; then
          echo "::error::$python_bin is older than 3.11; setup-python did not take effect."
          exit 1
        fi
        "$python_bin" tool/ci/plugin_provenance.py --write-env "$GITHUB_ENV"
        "$python_bin" tool/ci/plugin_provenance.py
