name: qfli_web
description: "QFLIWebForge：手机上的网页 IDE，本地静态服务器预览，console 输出回传到编辑器。"
publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  qfli_studio_core:
    path: ../../packages/qfli_studio_core

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 只有 test/web_app_test.dart 用它做路径处理，所以放 dev_dependencies。
  # 不显式声明的话 flutter analyze 会报 depend_on_referenced_packages。
  path: ^1.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
